name: Deploy to GitHub Pages

on:
  push: 
    branches: ["main"]  # or your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

title: Grace's Canopy Exploration
collection:
  - https://api.dc.library.northwestern.edu/api/v2/collections/3c863d97-07c2-4a75-bcb5-5ad3bfb3bcd0?as=iiif
  - https://api.dc.library.northwestern.edu/api/v2/collections/f2fc1bd8-c37f-4486-b28a-509f0e0362e1?as=iiif
manifest:
metadata:
  - Subject
  - Date
  - Language
  - Genre
featured:
  - https://api.dc.library.northwestern.edu/api/v2/works/60f7459a-53ad-4b30-9a36-99340046bcdb?as=iiif
search:
  page:
    title: Search
    description: Use this to search my prototype site.
  results:
    work:
      layout: grid
      result: figure
    page:
      layout: list
      result: article
  index:
    metadata:
      enabled: true
      all: false
    summary:
      enabled: true
    annotations:
      enabled: false
      motivation:
        - commenting
        - tagging
theme:
  appearance: dark
  accentColor: sky
  grayColor: mauve
